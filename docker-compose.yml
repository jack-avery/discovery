services:
  front:
    image: "caddy:2.11-alpine"
    restart: no
    volumes:
      - ./conf/caddy:/etc/caddy:ro
      - ./front/dist:/usr/share/caddy:ro
      - caddy-data:/data
    ports:
      - 80:80
      - 443:443
      - 443:443/udp

  back:
    build:
      context: back
    stop_signal: SIGINT
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_APP: run.py
    volumes:
      - uploads-data:/app/instance/uploads/resources

  db:
    image: "mysql:8.0-debian"
    command: --sql-mode="TRADITIONAL"
    restart: no
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  caddy-data:
  mysql-data:
  uploads-data: